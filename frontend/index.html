<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niyamadharshini</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    :root {
      --bg: #ffffff;        /* Light background */
      --text: #000000;      /* Light text */
      --card: #f9f9f9;
      --border: #ccc;
    }

    .dark-mode {
      --bg: #000000;        /* Dark background */
      --text: #ffffff;      /* Dark text */
      --card: #111111;
      --border: #333333;
    }

    body {
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      position: relative;
      background: var(--bg);
    }

    /* 🖼️ Background Image */
    .background-image {
      background: url("https://images.pexels.com/photos/6077123/pexels-photo-6077123.jpeg?_gl=1*llaea1*_ga*MTkyOTg1NjU3NS4xNzY2ODQ2NjI3*_ga_8JE65Q40S6*czE3NjY4NDY2MjYkbzEkZzEkdDE3NjY4NDY2MzQkajUyJGwwJGgw")
        center/cover no-repeat;
      opacity: 0.25;
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      filter: brightness(1.2);
      transition: opacity 0.3s ease;
    }

    /* 🌑 Dark mode background visibility */
    .dark-mode .background-image {
      opacity: 0.45;
      filter: brightness(1.2) contrast(1.1) saturate(1.2);
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 1rem;
      position: fixed;
      top: 0;
      left: -250px;
      height: 100%;
      transition: left 0.3s;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar h3 {
      font-size: 0.8rem;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .new-chat {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--border);
      color: var(--text);
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .chat-item {
      background: var(--card);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: 0.2s;
      color: var(--text);
    }

    .chat-item:hover {
      background: var(--border);
    }

    .chat-item.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .chat-item.active .delete-chat-btn {
      color: white !important;
    }

    /* Main Section - Chat Layout */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      z-index: 1;
      position: relative;
      margin-left: 0;
      transition: margin-left 0.3s ease;
    }

    .main.sidebar-open {
      margin-left: 250px;
    }

    /* Header */
    .chat-header {
      padding: 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .chat-header h1 {
      font-size: 1.8rem;
      color: var(--text);
    }

    /* Chat Messages Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Welcome Message */
    .welcome-message {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text);
      opacity: 0.7;
    }

    .welcome-message h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    /* Message Bubbles */
    .message {
      display: flex;
      gap: 0.5rem;
      max-width: 80%;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot {
      align-self: flex-start;
    }

    .message-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1rem 1.2rem;
      line-height: 1.8;
      word-wrap: break-word;
      color: var(--text);
    }

    /* Markdown styling in bot messages */
    .message-content h2 {
      font-size: 1.3rem;
      margin: 0.5rem 0 0.8rem 0;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.3rem;
    }

    .message-content h3 {
      font-size: 1.1rem;
      margin: 0.8rem 0 0.5rem 0;
      color: var(--text);
    }

    .message-content p {
      margin: 0.6rem 0;
      line-height: 1.7;
      color: var(--text);
    }

    .message-content ul, .message-content ol {
      margin: 0.5rem 0 0.5rem 1.5rem;
      line-height: 1.8;
      color: var(--text);
    }

    .message-content li {
      margin: 0.4rem 0;
      color: var(--text);
    }

    .message-content strong {
      font-weight: 600;
      color: var(--text);
    }

    .message-content code {
      background: rgba(0, 0, 0, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9em;
      color: var(--text);
    }

    .dark-mode .message-content code {
      background: rgba(255, 255, 255, 0.1);
    }

    .message.user .message-content {
      background: #007bff;
      color: white;
      border: none;
    }

    .message.user .message-content h2,
    .message.user .message-content h3,
    .message.user .message-content strong {
      color: white;
    }

    .message-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      background: var(--border);
    }

    .message.user .message-avatar {
      background: #007bff;
    }

    /* Sources in Bot Message */
    .message-sources {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .message.user .message-sources {
      border-top-color: rgba(255, 255, 255, 0.3);
    }

    .message-sources h4 {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .source-link {
      display: block;
      margin: 0.3rem 0;
      padding: 0.4rem;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .message.user .source-link {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .source-link:hover {
      opacity: 0.8;
      transform: translateX(3px);
    }

    /* Loading Message */
    .message.loading .message-content {
      background: var(--card);
      opacity: 0.8;
      font-style: italic;
    }

    /* Input Box - Fixed at Bottom */
    .input-box {
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: var(--card);
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      max-height: 150px;
      min-height: 50px;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    #sendBtn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    #sendBtn:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Error Message */
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 1rem;
      border-radius: 10px;
      margin: 0.5rem;
      text-align: center;
    }

    .dark-mode .error-message {
      background: #4a0000;
      color: #ff6b6b;
    }

    /* Top Buttons */
    .menu-btn,
    .theme-toggle {
      position: fixed;
      top: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
      z-index: 20;
      color: var(--text);
    }

    .menu-btn {
      left: 1rem;
    }

    .theme-toggle {
      right: 1rem;
    }

    .menu-btn:hover,
    .theme-toggle:hover {
      background: var(--border);
    }

    /* Copy Button */
    .copy-button {
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .copy-button:hover {
      opacity: 1;
      background: var(--border);
      transform: translateY(-1px);
    }

    .copy-button.copied {
      background: #4caf50;
      color: white;
      border-color: #4caf50;
      opacity: 1;
    }

    .copy-button .icon {
      font-size: 1rem;
    }
  </style>
  
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div class="background-image"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="new-chat" id="newChatBtn">➕ New Chat</button>
      <h3>Recent Chats</h3>
      <div id="chatList">
        <div class="chat-item">Indian Penal Code Section 420</div>
        <div class="chat-item">Right to Information Act 2005</div>
        <div class="chat-item">Constitutional Amendment Process</div>
      </div>
    </div>

    <!-- Top Buttons -->
    <button class="menu-btn" id="menuBtn">☰</button>
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <!-- Main Section - Chat Layout -->
    <div class="main" id="mainSection">
      <!-- Header -->
      <div class="chat-header">
        <h1>നിയമദർശിനി</h1>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
          <h2>Welcome!</h2>
          <p>Ask me about any Indian law, bill, or act in Malayalam or English</p>
        </div>
      </div>

      <!-- Input Box at Bottom -->
      <div class="input-box">
        <textarea id="queryInput" placeholder="Type your question..."></textarea>
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById("app");
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const mainSection = document.getElementById("mainSection");
    const themeToggle = document.getElementById("themeToggle");
    const newChatBtn = document.getElementById("newChatBtn");
    const sendBtn = document.getElementById("sendBtn");
    const queryInput = document.getElementById("queryInput");
    const chatMessages = document.getElementById("chatMessages");
    const chatList = document.getElementById("chatList");

    const API_URL = "http://localhost:8000/api/ask";   // or 5001 if you changed the port
    const STORAGE_KEY = "niyamadharshini_chats";
    
    // Current conversation state
    let currentChatId = null;
    let currentMessages = [];

    // Chat History Manager
    class ChatHistoryManager {
      constructor() {
        this.chats = this.loadChats();
      }

      loadChats() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : [];
        } catch (error) {
          console.error("Error loading chats:", error);
          return [];
        }
      }

      saveChats() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.chats));
        } catch (error) {
          console.error("Error saving chats:", error);
        }
      }

      createChat(firstMessage = "") {
        const chat = {
          id: Date.now().toString(),
          timestamp: new Date().toISOString(),
          title: firstMessage.substring(0, 50) || "New Chat",
          messages: []
        };
        this.chats.unshift(chat);
        this.saveChats();
        return chat;
      }

      updateChat(chatId, messages) {
        const chat = this.chats.find(c => c.id === chatId);
        if (chat) {
          chat.messages = messages;
          chat.timestamp = new Date().toISOString();
          
          // Update title from first user message
          const firstUserMsg = messages.find(m => m.type === 'user');
          if (firstUserMsg) {
            chat.title = firstUserMsg.content.substring(0, 50);
          }
          
          this.saveChats();
        }
      }

      getChat(chatId) {
        return this.chats.find(c => c.id === chatId);
      }

      deleteChat(chatId) {
        this.chats = this.chats.filter(c => c.id !== chatId);
        this.saveChats();
      }

      getAllChats() {
        return this.chats;
      }
    }

    const chatHistory = new ChatHistoryManager();

    // Sidebar toggle
    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      mainSection.classList.toggle("sidebar-open");
    });

    // Theme toggle (black <-> white)
    themeToggle.addEventListener("click", () => {
      app.classList.toggle("dark-mode");
      themeToggle.textContent = app.classList.contains("dark-mode") ? "☀️" : "🌙";
    });

    // New Chat
    newChatBtn.addEventListener("click", () => {
      startNewChat();
    });

    function startNewChat() {
      // Save current chat if it has messages
      if (currentChatId && currentMessages.length > 0) {
        chatHistory.updateChat(currentChatId, currentMessages);
      }

      // Reset state
      currentChatId = null;
      currentMessages = [];
      queryInput.value = "";
      
      // Clear UI
      chatMessages.innerHTML = `
        <div class="welcome-message">
          <h2>👋 Welcome!</h2>
          <p>Ask me about any Indian law, bill, or act in Malayalam or English</p>
        </div>
      `;

      // Refresh sidebar
      renderChatList();
    }

    function loadChat(chatId) {
      const chat = chatHistory.getChat(chatId);
      if (!chat) return;

      // Save current chat before switching
      if (currentChatId && currentMessages.length > 0) {
        chatHistory.updateChat(currentChatId, currentMessages);
      }

      // Load selected chat
      currentChatId = chatId;
      currentMessages = [...chat.messages];

      // Clear and render messages
      chatMessages.innerHTML = "";
      chat.messages.forEach(msg => {
        if (msg.type === 'user') {
          addUserMessage(msg.content, false);
        } else if (msg.type === 'bot') {
          addBotMessage(msg.content, msg.sources || [], false);
        }
      });

      // Close sidebar on mobile
      if (window.innerWidth < 768) {
        sidebar.classList.remove("active");
        mainSection.classList.remove("sidebar-open");
      }
    }

    function renderChatList() {
      const chats = chatHistory.getAllChats();
      
      if (chats.length === 0) {
        chatList.innerHTML = '<div class="chat-item" style="opacity: 0.5; cursor: default;">No saved chats yet</div>';
        return;
      }

      chatList.innerHTML = chats.map(chat => {
        const date = new Date(chat.timestamp);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const isActive = chat.id === currentChatId;
        
        return `
          <div class="chat-item ${isActive ? 'active' : ''}" data-chat-id="${chat.id}">
            <div style="display: flex; justify-content: space-between; align-items: start;">
              <div style="flex: 1; overflow: hidden;">
                <div style="font-size: 0.9rem; font-weight: 500; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  ${chat.title}
                </div>
                <div style="font-size: 0.75rem; opacity: 0.6;">
                  ${dateStr} • ${chat.messages.length} msgs
                </div>
              </div>
              <button class="delete-chat-btn" data-chat-id="${chat.id}" style="background: none; border: none; color: var(--text); opacity: 0.5; cursor: pointer; padding: 2px 6px; font-size: 1rem;" title="Delete chat">×</button>
            </div>
          </div>
        `;
      }).join('');

      // Add click listeners
      document.querySelectorAll('.chat-item').forEach(item => {
        const chatId = item.dataset.chatId;
        item.addEventListener('click', (e) => {
          if (!e.target.classList.contains('delete-chat-btn')) {
            loadChat(chatId);
          }
        });
      });

      // Add delete listeners
      document.querySelectorAll('.delete-chat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const chatId = btn.dataset.chatId;
          if (confirm('Delete this chat?')) {
            chatHistory.deleteChat(chatId);
            if (currentChatId === chatId) {
              startNewChat();
            } else {
              renderChatList();
            }
          }
        });
      });
    }

    // Auto-resize textarea
    queryInput.addEventListener("input", () => {
      queryInput.style.height = "auto";
      queryInput.style.height = queryInput.scrollHeight + "px";
    });

    // Add user message to chat
    function addUserMessage(text, saveToHistory = true) {
      const welcomeMsg = chatMessages.querySelector(".welcome-message");
      if (welcomeMsg) welcomeMsg.remove();

      const messageDiv = document.createElement("div");
      messageDiv.className = "message user";
      messageDiv.innerHTML = `
        <div class="message-avatar">👤</div>
        <div class="message-content">${text}</div>
      `;
      chatMessages.appendChild(messageDiv);
      scrollToBottom();

      // Save to current conversation
      if (saveToHistory) {
        currentMessages.push({
          type: 'user',
          content: text,
          timestamp: new Date().toISOString()
        });
      }
    }

    // Add bot message to chat
    function addBotMessage(answer, sources = [], saveToHistory = true) {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message bot";
      
      // Convert markdown to HTML using marked.js
      const htmlAnswer = marked.parse(answer);
      
      let sourcesHtml = "";
      if (sources && sources.length > 0) {
        sourcesHtml = `
          <div class="message-sources">
            <h4>📚 Sources:</h4>
            ${sources.map(source => `
              <a href="/data/${encodeURIComponent(source.pdf)}" target="_blank" class="source-link">
                📄 ${source.pdf} | Page ${source.page} | Relevance: ${(1 - source.distance).toFixed(3)}
              </a>
            `).join("")}
          </div>
        `;
      }

      messageDiv.innerHTML = `
        <div class="message-avatar">👩🏻‍✈️</div>
        <div class="message-content">
          ${htmlAnswer}
          ${sourcesHtml}
          <button class="copy-button" title="Copy answer">
            <span class="icon">▪️</span>
            <span class="text">Copy</span>
          </button>
        </div>
      `;
      chatMessages.appendChild(messageDiv);
      
      // Add copy functionality
      const copyBtn = messageDiv.querySelector('.copy-button');
      copyBtn.addEventListener('click', () => {
        // Copy the plain text answer (without sources)
        navigator.clipboard.writeText(answer).then(() => {
          // Show success feedback
          const icon = copyBtn.querySelector('.icon');
          const text = copyBtn.querySelector('.text');
          const originalIcon = icon.textContent;
          const originalText = text.textContent;
          
          icon.textContent = '✓';
          text.textContent = 'Copied!';
          copyBtn.classList.add('copied');
          
          // Reset after 2 seconds
          setTimeout(() => {
            icon.textContent = originalIcon;
            text.textContent = originalText;
            copyBtn.classList.remove('copied');
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy:', err);
          alert('Failed to copy to clipboard');
        });
      });
      
      scrollToBottom();

      // Save to current conversation
      if (saveToHistory) {
        currentMessages.push({
          type: 'bot',
          content: answer,
          sources: sources,
          timestamp: new Date().toISOString()
        });

        // Auto-save conversation
        if (currentChatId) {
          chatHistory.updateChat(currentChatId, currentMessages);
        } else {
          // Create new chat on first bot response
          const firstUserMsg = currentMessages.find(m => m.type === 'user');
          const chat = chatHistory.createChat(firstUserMsg?.content || 'New Chat');
          currentChatId = chat.id;
          chatHistory.updateChat(currentChatId, currentMessages);
        }
        
        renderChatList();
      }
    }

    // Add loading message
    function addLoadingMessage() {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message bot loading";
      messageDiv.id = "loadingMessage";
      messageDiv.innerHTML = `
        <div class="message-avatar"></div>
        <div class="message-content">⏳ Searching documents and generating answer...</div>
      `;
      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    // Remove loading message
    function removeLoadingMessage() {
      const loadingMsg = document.getElementById("loadingMessage");
      if (loadingMsg) loadingMsg.remove();
    }

    // Show error message
    function showError(errorText) {
      const errorDiv = document.createElement("div");
      errorDiv.className = "error-message";
      errorDiv.textContent = `❌ ${errorText}`;
      chatMessages.appendChild(errorDiv);
      scrollToBottom();
    }

    // Scroll to bottom
    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Check if message is a casual greeting/chat
    function isCasualMessage(text) {
      const casual = /^(hi|hello|hey|hii|helo|hai|helo|namaste|വണക്കം|ഹലോ|ഹായ്|thanks|thank you|നന്ദി|ok|okay|yes|no|ഉം|ശരി)[\s!.?]*$/i;
      return casual.test(text.trim());
    }

    // Generate casual response
    function getCasualResponse(question) {
      const greetings = ['hi', 'hello', 'hey', 'namaste', 'hai', 'വണക്കം', 'ഹലോ', 'ഹായ്'];
      const thanks = ['thanks', 'thank you', 'നന്ദി'];
      
      const lowerQ = question.toLowerCase();
      
      if (greetings.some(g => lowerQ.includes(g))) {
        return "Hello! 👋\n\nI'm നിയമദർശിനി, your Malayalam legal assistant. I can help you with questions about Kerala Government Gazettes, Orders, Notifications, and legal documents.\n\nPlease ask me any specific legal question, and I'll search through the documents to provide you with accurate information!";
      }
      
      if (thanks.some(t => lowerQ.includes(t))) {
        return "You're welcome! 😊\n\nFeel free to ask if you have any more legal questions. I'm here to help!";
      }
      
      if (lowerQ.includes('ok') || lowerQ.includes('okay') || lowerQ.includes('ശരി')) {
        return "Great! If you have any legal questions, just ask. I'm here to help! 📚";
      }
      
      return null;
    }

    // Send question to backend
    async function askQuestion() {
      const question = queryInput.value.trim();
      
      if (!question) {
        return;
      }

      // Add user message
      addUserMessage(question);
      
      // Clear input and reset height
      queryInput.value = "";
      queryInput.style.height = "auto";

      // Check if it's a casual message (no need to hit API)
      if (isCasualMessage(question)) {
        const casualResponse = getCasualResponse(question);
        if (casualResponse) {
          // Add bot response without sources
          setTimeout(() => {
            addBotMessage(casualResponse, []);
          }, 500); // Small delay for better UX
          return;
        }
      }

      // Show loading
      addLoadingMessage();
      sendBtn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ question: question }),
        });

        removeLoadingMessage();

        if (response.status === 503) {
          // Handle rate limit / service unavailable
          const data = await response.json();
          showError(`⏳ AI service is currently overloaded. ${data.error || 'Please try again in a few minutes or wait for the quota to reset.'}`);
          return;
        }

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        // Add bot response
        if (data.answer) {
          addBotMessage(data.answer, data.sources || []);
        }

      } catch (error) {
        console.error("Error:", error);
        removeLoadingMessage();
        
        if (error.message.includes("Failed to fetch")) {
          showError("❌ Cannot connect to API server. Make sure the server is running on http://localhost:5000");
        } else {
          showError(`❌ ${error.message}`);
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    // Send button click
    sendBtn.addEventListener("click", askQuestion);

    // Enter key to send (Shift+Enter for new line)
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        askQuestion();
      }
    });

    // Initialize app
    renderChatList();
  </script>
</body>
</html>
